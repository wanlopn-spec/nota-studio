<title>NOTA STUDIO (GW)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Music&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: one app window — top bar, tab strip, tool ribbon, palette | engraved paper | inspector, transport, status bar */
:root{
  --bg:#121110; --chrome:#1d1c1a; --panel:#232120; --panel-2:#2b2926; --raise:#34302c; --line:#38342f; --line-2:#4a443e;
  --fg:#ece6dc; --muted:#a59d92; --dim:#716a61;
  --accent:#e9a15b; --accent-hi:#f3b77a; --accent-ink:#2b1a09; --accent-soft:rgba(233,161,91,.15); --accent-line:rgba(233,161,91,.45);
  --desk:#0f0e0d; --paper:#f6f0e2; --paper-shadow:rgba(0,0,0,.45); --ink:#1b1814; --sel:#d4731f;
  --ok:#86bd84; --danger:#e57a6b;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-music:'Noto Music','Segoe UI Symbol','Apple Symbols',serif;
  --f-score:'EB Garamond',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--f-ui);overflow:hidden;box-sizing:border-box;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

#app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;background:var(--chrome);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:20px/1 var(--f-music);flex:none}
.brand b{font-weight:800;letter-spacing:.12em;font-size:12px}
.doc{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.doc span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.doc small{color:var(--muted);font-size:11px}
.cmd{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);text-align:left;min-width:0}
.cmd span:nth-child(2){flex:1}
.cmd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font:11px var(--f-mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted)}
.topacts{display:flex;gap:2px}
.tbtn{background:none;border:0;border-radius:7px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:10.5px;min-width:46px}
.tbtn i{font-style:normal;font-size:16px;color:var(--fg);line-height:1.1}
.tbtn:hover{background:var(--panel-2);color:var(--fg)}

/* tabs */
.tabs{display:flex;align-items:center;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:7px 12px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);border-radius:7px 7px 0 0;white-space:nowrap;text-transform:uppercase}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent-line);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;margin-left:10px;white-space:nowrap}
.chip.off{border-color:var(--line-2);color:var(--muted);background:transparent}

/* ribbon */
.ribbon{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;min-height:92px;align-items:stretch}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 6px 6px;display:flex;flex-direction:column;gap:4px;flex:none}
.grp > label{font-size:10.5px;color:var(--muted);padding:0 4px;display:flex;justify-content:space-between;gap:10px}
.row{display:flex;gap:3px;align-items:center}
.rb{background:none;border:1px solid transparent;border-radius:7px;min-width:44px;height:52px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;white-space:nowrap}
.rb i{font-style:normal;font-size:20px;color:var(--fg);line-height:1;font-family:var(--f-music)}
.rb i.t{font-family:var(--f-score);font-style:italic;font-weight:600;font-size:19px}
.rb i.u{font-family:var(--f-ui);font-size:15px;font-weight:700}
.rb:hover{background:var(--panel-2);color:var(--fg)}
.rb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.rb[aria-pressed="true"] i{color:var(--accent-hi)}
.rb.vb[aria-pressed="true"]{background:color-mix(in srgb,var(--vc) 18%,transparent);border-color:var(--vc);color:var(--vc)}
.rb.sm{height:40px;min-width:36px}
.field{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.inp,.sel{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0}
.inp:focus,.sel:focus{border-color:var(--accent);outline:none}
.inp.num{width:62px;font-family:var(--f-mono)}

/* main */
.main{display:grid;grid-template-columns:262px minmax(0,1fr) 288px;min-height:0}
.side{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side.right{border-right:0;border-left:1px solid var(--line)}
.sidehead{display:flex;gap:2px;padding:8px 8px 6px;border-bottom:1px solid var(--line)}
.stab{flex:1;background:none;border:0;border-radius:6px;padding:5px 4px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stab[aria-selected="true"]{background:var(--panel-2);color:var(--accent)}
.sidebody{flex:1;overflow:auto;padding:10px;min-height:0}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;margin-bottom:10px}
.search input{background:none;border:0;outline:none;flex:1;min-width:0}
.pal{margin-bottom:10px}
.pal h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.pal h4 em{font-style:normal;color:var(--dim);font-family:var(--f-mono)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:7px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:22px/1 var(--f-music);color:var(--fg);padding:0 2px;overflow:hidden}
.cell small{font:9.5px/1.1 var(--f-ui);color:var(--muted);margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cell.t{font:italic 600 18px/1 var(--f-score)}
.cell.u{font:700 12px/1.1 var(--f-ui)}
.cell:hover{border-color:var(--accent-line);background:var(--panel-2)}

/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--desk)}
.strip{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--chrome);font-size:11px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.strip b{color:var(--fg);letter-spacing:.08em;font-weight:700}
.strip .sp{flex:1}
.strip .pill{border:1px solid var(--line-2);border-radius:5px;padding:1px 7px}
.canvas{flex:1;overflow:auto;position:relative;padding:28px 28px 60px}
.pages{display:flex;flex-direction:column;align-items:center;gap:28px;width:max-content;min-width:100%}
.pages.cont{align-items:flex-start}
.page{position:relative;background:var(--paper);box-shadow:0 2px 0 rgba(255,255,255,.02),0 14px 40px var(--paper-shadow);border-radius:2px;line-height:0}
.page svg{display:block}
.page svg text{user-select:none}
.mtools{position:absolute;z-index:15;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--accent-line);border-radius:8px;padding:3px;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.2;white-space:nowrap;font-size:12px}
.mtools span{color:var(--muted);padding:0 6px 0 4px;font-weight:600}
.mtools button{background:none;border:0;border-radius:5px;padding:4px 8px;color:var(--fg);font-weight:600}
.mtools button:hover{background:var(--panel-2)}
.mtools button.del{color:var(--danger)}
.mtools button.del:hover{background:rgba(229,122,107,.14)}
.addend{position:absolute;z-index:14;width:26px;height:26px;border-radius:50%;border:1px dashed rgba(184,94,20,.6);background:rgba(233,161,91,.15);color:#a8561a;font:700 16px/1 var(--f-ui);display:grid;place-items:center;padding:0}
.addend:hover{background:var(--accent);color:var(--accent-ink);border-style:solid}
.playhead{position:absolute;width:2px;background:var(--sel);box-shadow:0 0 0 3px var(--accent-soft);pointer-events:none;border-radius:2px}
.empty{color:var(--muted);padding:40px;text-align:center}

/* inspector */
.sec{border-bottom:1px solid var(--line);padding:10px 2px 12px}
.sec:first-child{padding-top:0}
.sec h5{margin:0 0 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 8px;align-items:center}
.kv > span{color:var(--muted);font-size:12px}
.kv .inp,.kv .sel{width:100%}
.big{font:600 15px var(--f-ui);color:var(--fg)}
.note{font-size:11.5px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.b{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:600}
.b:hover{border-color:var(--accent-line)}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.pri:hover{background:var(--accent-hi)}
.b.ghost{background:none}
.b[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg);cursor:pointer}
.toggle input{accent-color:var(--accent)}
.inst{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:5px}
.inst .nm{flex:1;min-width:0;background:none;border:0;padding:2px 4px;border-radius:4px}
.inst .nm:focus{background:var(--bg);outline:1px solid var(--accent)}
.ib{background:none;border:0;color:var(--muted);width:24px;height:24px;border-radius:5px;font-size:13px}
.ib:hover{background:var(--panel-2);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.mix{padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);margin-bottom:5px}
.mix .h{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600;font-size:12px}
.mix .h span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{accent-color:var(--accent);width:100%}

/* transport + status */
.transport{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line);background:var(--chrome);min-width:0;overflow-x:auto}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:7px;width:32px;height:28px;display:grid;place-items:center;font-size:13px;color:var(--fg);flex:none}
.tp.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tp[aria-pressed="true"]{border-color:var(--accent-line);color:var(--accent)}
.clock{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums;margin:0 6px;flex:none}
.clock small{font-size:11px;color:var(--muted);font-weight:400}
.track{flex:1;min-width:80px;height:4px;background:var(--line);border-radius:3px;position:relative}
.track div{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0}
.tempo{font:12px var(--f-mono);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px;flex:none}
.status{display:flex;align-items:center;gap:14px;padding:5px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.status .sp{flex:1}
.status b{color:var(--fg);font-weight:600}
.status .mode.on{color:var(--accent)}
.vbtn{background:none;border:0;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:11px}
.vbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(8,7,6,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(60px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:15px;flex:1}
.modal .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.tmpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tmpl button{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tmpl button b{font-size:13px}
.tmpl button small{color:var(--muted);font-size:11px;line-height:1.3}
.tmpl button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.catalog button{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;text-align:left;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.catalog button small{color:var(--dim);font-family:var(--f-mono);font-size:10.5px}
.catalog button:hover{border-color:var(--accent-line)}
.palette{width:min(600px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.palette input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
.palette li{padding:8px 10px;border-radius:7px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.palette li[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.palette li small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.pop{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:4px;line-height:1.3}
.pop input{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:200px;outline:none}
.pop small{color:var(--muted);font-size:10.5px}
.toast{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line-2);padding:8px 14px;border-radius:8px;z-index:60;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mobtoggle{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
.skiplink{position:fixed;z-index:200;top:max(8px,env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));transform:translateY(-300%);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.skiplink:focus{transform:none}
.langseg{display:inline-flex;align-self:center;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin:0 4px;flex:none}
.langseg button{background:none;border:0;padding:5px 9px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.langseg button+button{border-left:1px solid var(--line-2)}
.langseg button:hover{color:var(--fg);background:var(--panel-2)}
.langseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:860px){.langseg button{padding:5px 6px;font-size:10.5px}.topacts{min-width:0;flex:1;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}.topacts::-webkit-scrollbar{display:none}}
#btnA11y[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.preset{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset b{font-size:12px}
.sw{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.sw i{flex:1}
.colorrow{display:grid;grid-template-columns:110px auto minmax(0,1fr);gap:8px;align-items:center}
.colorrow input[type=color]{width:44px;height:30px;border:1px solid var(--line-2);border-radius:6px;background:none;padding:2px;cursor:pointer}
.colorrow code{font:12px var(--f-mono);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

@media (max-width:1100px){.main{grid-template-columns:220px minmax(0,1fr) 250px}}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;width:min(300px,86vw);z-index:40;box-shadow:0 0 40px rgba(0,0,0,.6);padding-top:env(safe-area-inset-top,0px)}
  .side.left{left:0;padding-left:env(safe-area-inset-left,0px)}
  .side.right{right:0;padding-right:env(safe-area-inset-right,0px)}
  .side:not(.open){display:none}
  .mobtoggle{display:inline-flex}
  .cmd,.topacts .tbtn small,.brand b{display:none}
  .tbtn{min-width:34px}
  .top{gap:6px}
  .doc{display:none}
  .canvas{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<button class="skiplink" data-act="a11y">เปิดเสียงนำทางสำหรับผู้พิการทางสายตา (กด F2)</button>
<div id="a11yLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">𝄞</div><b>NOTA STUDIO <span style="color:var(--accent)">(GW)</span></b></div>
    <div class="doc"><span id="docTitle">—</span><small id="docState">บันทึกแล้ว</small></div>
    <button class="cmd" id="cmdBtn" aria-label="ค้นหาคำสั่ง"><span>⌕</span><span>จะเปลี่ยนอะไร? พิมพ์ "slur", "tempo", "transpose"…</span><kbd class="kbd">Ctrl K</kbd></button>
